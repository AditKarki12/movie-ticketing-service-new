services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elastic

  neo4j:
    image: neo4j:2.3.12
    container_name: graphify-neo4j
    environment:
      - NEO4J_AUTH=none
      - NEO4J_THIRDPARTY_JAXRS_CLASSES=org.neo4j.nlp.ext=/service
    ports:
      - "7474:7474"
    volumes:
      - ./docker/graphify-plugins:/plugins

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - elastic

networks:
  elastic:
    driver: bridge
